# ============================================================================
#  YouTube 去广告 — Quantumult X 远程重写资源
# ============================================================================
#
#  用法（Quantumult X 设置 → 重写 → 引用 → 添加）:
#      https://raw.githubusercontent.com/m6506659306/QuantumultX/refs/heads/main/Rewrite/youtube-adblock-macos.conf
#
#  ⚠️ 这是「重写资源」, 不是「配置文件」。
#     格式为扁平结构, 没有 [general] / [policy] 等段落标题。
#     如果把它当作「配置文件」导入, QX 会报格式错误。
#
#  实测依据 : 2026-09 真实抓包 (Chrome 网页端)
#     InnerTube 请求走的是 www.youtube.com, 不是 youtubei.googleapis.com
#     get_watch 响应中的广告字段: adPlacements / adSlots / playerAds /
#                                 adBreakHeartbeatParams / adSlotAndLayoutMetadata
#
#  保持视频域直通 (三个条件必须同时成立, 否则会出现缓冲变长 / 播放中断):
#     1. 本文件及主配置的 hostname 里没有 googlevideo.com
#     2. 主配置 [filter_local] 里没有 googlevideo.com 的 REJECT
#     3. 主配置 [rewrite_local] 里没有 googlevideo 的 URL 重写
# ============================================================================

# MITM 解密范围。InnerTube API 的实际宿主是 www.youtube.com。
# 额外域名 youtubei.googleapis.com 用于兼容仍走旧域名的客户端。
hostname = www.youtube.com, youtubei.googleapis.com

# ----------------------------------------------------------------------------
# 删除 get_watch / next 响应中的广告字段
#   requires-body  : 需要读取并改写响应体
#   max-size=-1    : 不限制体积。get_watch 响应接近 2MB,
#                    若设体积上限会被截断成非法 JSON, 导致脚本静默失效
# ----------------------------------------------------------------------------
^https:\/\/www\.youtube\.com\/youtubei\/v1\/(get_watch|next|player|browse|search|reel) url script-response-body https://raw.githubusercontent.com/m6506659306/QuantumultX/refs/heads/main/Rewrite/youtube.player.response.js, requires-body=1, max-size=-1

^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(get_watch|next|player|browse|search|reel) url script-response-body https://raw.githubusercontent.com/m6506659306/QuantumultX/refs/heads/main/Rewrite/youtube.player.response.js, requires-body=1, max-size=-1

# ============================================================================
#  导入后还需要确认的项
# ============================================================================
#
#  1. HTTPS 解密总开关必须打开
#     QX → 设置 → 证书 → 生成证书 → 安装并在钥匙串中「始终信任」
#
#  2. 如果主配置里存在下列规则, 请删除 —— 它们会让视频域不再直通:
#       [MITM] hostname 里含 *.googlevideo.com
#       [rewrite_local] 里含 googlevideo 的 URL 重写
#       [filter_local] 里含 DOMAIN-SUFFIX,googlevideo.com,REJECT
#
#  3. 浏览器插件 (Safari Content Blocker 等) 里也应删掉命中下列模式的规则,
#     去广告职责全部交给 QX, 避免两层叠加导致变慢与中断:
#       googlevideo.com
#       youtubei.googleapis.com
#       videoplayback
#       ctier
#
#     插件只保留这两类即可:
#       - DOM 隐藏 (css-display-none, 无网络副作用)
#       - 独立广告域: googlesyndication.com / doubleclick.net /
#                     googleadservices.com / adservice.google.com
# ============================================================================
