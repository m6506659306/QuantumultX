// ==UserScript==
// @ScriptName        豆瓣去广告[自持版]
// @Author            奶思
// @ForkedBy          m6506659306
// @Function          屏蔽豆瓣 App 的开屏、信息流与首页横幅广告:域名级 reject + 广告接口 reject-dict
// @Source            https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/rewrite/split/partD/Douban.snippet
// @SourceSha256      2a3cde6cf414e57ee86604d7881ac5e786ac958fd440385743c5ffa2ef33230c
// @SourceUpdated     2025-09-14(上游规则正文最后变更;文件头 #!date 字段已被上游脚本清空,不可作日期)
// @LocalChanges      1) 新增 frodo.douban.com/api/v2/erebor/ 接口拦截(2026-09-17 抓包实测直连未拦)
//                    2) hostname 由上游的 api.douban.com 补全为实际需要的 7 个域,否则 5 条 url 规则静默失效
// @Attention         规则正文来自奶思,此处仅作自持备份与上述两处改动;如需引用请注明原作者
// ==/UserScript==

hostname = api.douban.com, frodo.douban.com, erebor.douban.com, img1.doubanio.com, img2.doubanio.com, img3.doubanio.com, img9.doubanio.com

# > 域名级拦截:豆瓣广告投放域
host-suffix, erebor.douban.com, reject
host-suffix, ad.doubanio.com, reject

# > 广告接口:reject-dict 返回空 JSON,避免 App 解析异常
^https?:\/\/api\.douban\.com\/v\d\/app_ads\/ url reject-dict
^https?:\/\/api\.douban\.com\/b.*\/common_ads\?.* url reject-dict
^https?:\/\/frodo\.douban\.com\/api\/v2\/erebor\/ url reject-dict

# > 广告素材与首页横幅
^https?:\/\/img\d\.doubanio\.com\/view\/dale-online\/dale_ad\/ url reject
^https?:\/\/frodo\.douban\.com\/api\/v2\/movie\/banner url reject
^https?:\/\/erebor\.douban\.com\/count\/\?ad= url reject
