// ==UserScript==
// @ScriptName        豆瓣去广告[自持版]
// @Author            奶思
// @ForkedBy          m6506659306
// @Function          屏蔽豆瓣 App 的开屏、信息流与首页/电影页广告:域名级 reject + 广告接口 reject-dict
// @Source            https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/rewrite/split/partD/Douban.snippet
// @SourceSha256      2a3cde6cf414e57ee86604d7881ac5e786ac958fd440385743c5ffa2ef33230c
// @SourceUpdated     2025-09-14(上游规则正文最后变更;文件头 #!date 字段已被上游脚本清空,不可作日期)
// @LocalChanges      1) 新增 frodo.douban.com/api/v2/erebor/ 接口拦截(2026-09-17 抓包实测直连未拦)
//                    2) hostname 补全:图片域展开为 img1~img9.doubanio.com(规则匹配 img\d 而原声明只列 1/2/3/9,
//                       img4-8 的请求不解密、素材规则静默失效);QX 只验证过 *.domain 前缀通配,故此处不用中缀 *
//                    3) erebor.douban.com 既已整域 reject,连接不进入 rewrite 引擎,
//                       原 ^https?:\/\/erebor\.douban\.com\/count\/\?ad= 规则与 hostname 声明均为死代码,已移除
//                    4) 素材请求 reject → reject-img(2026-09-17 抓包实测:命中时 QX 以 404 空体应答,素材不再下载)
//                    5) frodo.douban.com/api/v2/movie/banner reject → reject-dict(返回 {},避免 404 空体解析异常)
//                    6) 2026-09-17 二轮 A/B 抓包新增两条接口拦截:
//                       movie/ad(电影页广告:重写全开段仍返回 4.6 KB 真实广告,ad_id/creative_id/dale_ad 素材齐全)、
//                       movie/<id>/ad(单片广告位,同族路径,一并覆盖);
//                       home_banner(首页横幅广告:重写全开段仍返回 3.0 KB 真实广告,ad_id 270540 + erebor 点击上报)
//                    7) 保留 movie/banner 与 api.douban.com/b*/common_ads 两条规则:二轮抓包 0 命中,
//                       疑为老版本或 Android 端路径,留作兜底(不命中不产生副作用)
// @Attention         规则正文来自奶思,此处仅作自持备份与上述改动;如需引用请注明原作者
// ==/UserScript==

hostname = api.douban.com, frodo.douban.com, img1.doubanio.com, img2.doubanio.com, img3.doubanio.com, img4.doubanio.com, img5.doubanio.com, img6.doubanio.com, img7.doubanio.com, img8.doubanio.com, img9.doubanio.com

# > 域名级拦截:豆瓣广告投放域(连接层拦截,无需 MitM)
host-suffix, erebor.douban.com, reject
host-suffix, ad.doubanio.com, reject

# > 广告接口:reject-dict 返回空 JSON,避免 App 解析异常
^https?:\/\/api\.douban\.com\/v\d\/app_ads\/ url reject-dict
^https?:\/\/api\.douban\.com\/b.*\/common_ads\?.* url reject-dict
^https?:\/\/frodo\.douban\.com\/api\/v2\/erebor\/ url reject-dict
^https?:\/\/frodo\.douban\.com\/api\/v2\/movie\/(?:\d+\/)?ad(\?|$) url reject-dict
^https?:\/\/frodo\.douban\.com\/api\/v2\/home_banner url reject-dict
^https?:\/\/frodo\.douban\.com\/api\/v2\/movie\/banner url reject-dict

# > 广告素材:豆瓣 dale 广告位素材域(QX 以 404 空体应答,断掉素材下载)
^https?:\/\/img\d\.doubanio\.com\/view\/dale-online\/dale_ad\/ url reject-img
